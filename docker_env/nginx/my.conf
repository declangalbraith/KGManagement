server {
    listen       8080;
    server_name localhost;
    client_max_body_size 100M;
    location / {
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        set_real_ip_from 0.0.0.0/0;
        real_ip_header X-Forwarded-For;
        root /usr/share/nginx/html;
        index  index.html index.php index.htm;
        # 禁止缓存html文件,避免前端页面不及时更新，需要用户手动刷新的情况
        if ($request_uri ~* "^/$|^/index.html|^/index.htm") {
             add_header Cache-Control "no-store";
        }
    }

    location /api/ {
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Nginx-Proxy true;
        set_real_ip_from 0.0.0.0/0;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 600s;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        real_ip_header X-Forwarded-For;
        rewrite ^/api/(.*)$ /$1 break;  #重写
        proxy_pass http://butler-service-django:8000/;
    }
    location /media  {
	    alias /backend/media; 
	    expires 7d;
	    gzip  on;
	    gzip_min_length 1k;
	    gzip_comp_level 2;
	    gzip_types text/plain application/javascript application/x-javascript text/css application/xml text/javascript application/x-httpd-php image/jpeg image/gif image/png;
	    gzip_vary on;
	}
	location /api/media  {
	    alias /backend/media; 
	    expires 7d;
	    gzip  on;
	    gzip_min_length 1k;
	    gzip_comp_level 2;
	    gzip_types text/plain application/javascript application/x-javascript text/css application/xml text/javascript application/x-httpd-php image/jpeg image/gif image/png;
	    gzip_vary on;
	}

    # 8D knowledge subgraph (adjust upstream host/port to your 8D deployment)
    location /quality/8d/ws/ {
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_pass http://eight-d-backend:8000/ws/;
    }
    location /quality/8d/api/ {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://eight-d-backend:8000/api/;
    }
    location /quality/8d/ {
        proxy_set_header Host $host;
        proxy_pass http://eight-d-frontend:80/;
    }
 }
