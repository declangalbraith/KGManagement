services:
  butler-service-web:
    container_name: butler-service-web
    ports:
      - "8084:8080"
    build:
      context: ./
      dockerfile: ./docker_env/web/Dockerfile
    environment:
      TZ: Asia/Shanghai
    volumes:
      - ./docker_env/nginx/my.conf:/etc/nginx/conf.d/my.conf
      - ./backend/media:/backend/media
    expose:
      - "8080"
    restart: always
    networks:
      - butler-service-net

  butler-service-django:
    build:
      context: .
      dockerfile: ./docker_env/django/Dockerfile
    container_name: butler-service-django
    working_dir: /backend
    depends_on:
      - butler-service-postgres
      - butler-service-redis
    environment:
      PYTHONUNBUFFERED: 1
      DATABASE_HOST: butler-service-postgres
      TZ: Asia/Shanghai
    volumes:
      - ./backend:/backend
      - ./logs/log:/var/log
    ports:
      - "8004:8000"
    expose:
      - "8000"
    restart: always
    networks:
      - butler-service-net

  butler-service-postgres:
    image: postgres:16-alpine
    container_name: butler-service-postgres
    restart: always
    ports:
      - "5434:5432"
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: "butler-service-db-local-prod"
      TZ: Asia/Shanghai
    # 挂载子目录 pgdata，避免宿主机 data 下 .gitkeep 等文件导致 initdb 报「directory is not empty」
    volumes:
      - "./docker_env/postgres/pgdata:/var/lib/postgresql/data"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d 'butler-service-db-local-prod'"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - butler-service-net

  # Celery：需要异步任务时取消注释，并确保 backend 已配置 dvadmin3-celery
  # butler-service-celery:
  #   build:
  #     context: .
  #     dockerfile: ./docker_env/celery/Dockerfile
  #   container_name: butler-service-celery
  #   working_dir: /backend
  #   depends_on:
  #     - butler-service-postgres
  #   environment:
  #     PYTHONUNBUFFERED: 1
  #     DATABASE_HOST: butler-service-postgres
  #     TZ: Asia/Shanghai
  #   volumes:
  #     - ./backend:/backend
  #     - ./logs/log:/var/log
  #   restart: always
  #   networks:
  #     - butler-service-net

  butler-service-redis:
    image: redis:6.2.6-alpine
    container_name: butler-service-redis
    restart: always
    environment:
      - TZ=Asia/Shanghai
    volumes:
      - ./docker_env/redis/data:/data
      - ./docker_env/redis/redis.conf:/etc/redis/redis.conf
    ports:
      - "6374:6379"
    sysctls:
      - net.core.somaxconn=1024
    command: /bin/sh -c "echo 'vm.overcommit_memory = 1' >> /etc/sysctl.conf && redis-server /etc/redis/redis.conf --appendonly yes --requirepass ${REDIS_PASSWORD}"
    privileged: true
    networks:
      - butler-service-net

networks:
  butler-service-net:
    name: butler-service-net
